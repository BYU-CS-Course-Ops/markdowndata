name: MarkdownData Publish

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  publish:
    uses: BYU-CS-Course-Ops/utils/.github/workflows/publish.yaml@main
    with:
      pypi_package: "markdowndata"
      publisher: "poetry"
      project_name: "MarkdownData"
    secrets:
      pypi_token: ${{ secrets.PYPI_TOKEN }}
      discord_webhook_url: ${{ secrets.GHA_DISCORD_WEBHOOK }}
      discord_role: ${{ secrets.CICD_NOTIFY_DISCORD_ROLE }}
